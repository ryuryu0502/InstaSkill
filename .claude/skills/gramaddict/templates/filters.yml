# ============================================================
# GramAddict フィルター設定テンプレート
# 使用方法: accounts/<username>/filters.yml として保存
# 詳細: https://docs.gramaddict.org/#/filters
# ============================================================

# === プロフィールタイプフィルター ===
skip_if_private: false          # 非公開アカウントをスキップ
skip_if_public: false           # 公開アカウントをスキップ
skip_business: true             # ビジネスアカウントをスキップ
skip_non_business: false        # 非ビジネスアカウントをスキップ
skip_following: true            # 既にフォロー中をスキップ
skip_follower: true             # 既にフォロワーをスキップ
skip_if_link_in_bio: true       # プロフィールにリンクがある場合スキップ

# === プロフィール統計フィルター ===
min_followers: 50               # 最低フォロワー数
max_followers: 2500             # 最大フォロワー数
min_followings: 50              # 最低フォロー中数
max_followings: 2500            # 最大フォロー中数
min_potency_ratio: 0.5          # フォロワー/フォロー中の最小比率（低すぎ = スパム）
max_potency_ratio: 5            # 同上限（高すぎ = 有名人）
min_posts: 3                    # 最低投稿数
mutual_friends: -1              # 共通フォロー数（-1 = 無効）

# === プロフィール文フィルター ===
blacklist_words: [sex, link, promo, follow4follow, f4f]
mandatory_words: []             # プロフィールに必須の単語（空 = 無効）
specific_alphabet: [LATIN]      # 許可する文字セット
biography_language: [ja, en]    # 許可するプロフィール言語（ISO 639-1）
biography_banned_language: []   # 禁止言語

# === いいね数フィルター ===
min_likers: 1                   # 最低いいね数（スパム投稿除外）
max_likers: 1000                # 最大いいね数（バズ投稿除外）

# === コメント設定 ===
comment_photos: true            # 写真にコメント可能
comment_videos: true            # 動画にコメント可能
comment_carousels: true         # カルーセル投稿にコメント可能
